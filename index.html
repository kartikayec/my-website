<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartNiwas Portal</title>
    <meta name="description" content="SmartNiwas Portal - A unified glassmorphic home portal featuring a member directory, interactive notice board, and quick dashboard access.">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://smartniwas.com/">
    <meta property="og:title" content="SmartNiwas Portal">
    <meta property="og:description" content="A unified home portal featuring a member directory, interactive notice board, and quick dashboard access.">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://smartniwas.com/">
    <meta property="twitter:title" content="SmartNiwas Portal">
    <meta property="twitter:description" content="A unified home portal featuring a member directory, interactive notice board, and quick dashboard access.">

    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- MQTT Client Library -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
    <div class="glass-bg"></div>
    <div class="glass-bg secondary-bg"></div>

    <main class="portal-container">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">
                <i class="fa-solid fa-house-chimney-window"></i>
                <span>smart<strong>niwas</strong></span>
            </h1>
            <div class="header-controls">
                <button id="open-settings-btn" class="settings-btn" aria-label="Open Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
                <div id="live-clock" class="live-clock">Loading time...</div>
            </div>
        </header>

        <!-- Main Grid -->
        <div class="portal-grid">
            
            <!-- Column 1: Directory & IoT -->
            <div class="left-column">
                <section class="grid-section directory-section">
                    <h2><i class="fa-solid fa-users"></i> Member Directory</h2>
                    <div class="member-grid" id="member-grid">
                        <!-- Cards will be dynamically rendered by app.js -->
                    </div>
                </section>
                
                <!-- Dynamic IoT Section (Hidden by default, shown if configured) -->
                <section id="iot-section" class="grid-section iot-section hidden">
                    <h2><i class="fa-solid fa-microchip"></i> Smart Controls</h2>
                    <div class="iot-grid" id="iot-grid">
                        <!-- Dynamically injected MQTT switches and sensors -->
                    </div>
                </section>
            </div>

            <!-- Column 2: Dashboard, Notes & CCTV -->
            <div class="right-column">
                <!-- Quick Links -->
                <section class="grid-section links-section">
                    <h2><i class="fa-solid fa-compass"></i> Quick Dashboard Links</h2>
                    <div class="links-grid">
                        <a href="#" class="link-card"><i class="fa-solid fa-images"></i> Photos</a>
                        <a href="#" class="link-card"><i class="fa-solid fa-folder-open"></i> Shared Drive</a>
                        <a href="#" class="link-card"><i class="fa-solid fa-server"></i> Media Server</a>
                        <a href="#" class="link-card"><i class="fa-solid fa-laptop-house"></i> Home Assistant</a>
                    </div>
                </section>

                <!-- Dynamic CCTV Section (Hidden by default, shown if enabled) -->
                <section id="cctv-section" class="grid-section cctv-section hidden">
                    <h2><i class="fa-solid fa-video"></i> Security Monitor</h2>
                    <div class="cctv-grid" id="cctv-grid">
                        <!-- Dynamically injected NVR camera monitors -->
                    </div>
                </section>

                <!-- Sticky Notes Board -->
                <section class="grid-section notes-section">
                    <div class="notes-header">
                        <h2><i class="fa-solid fa-note-sticky"></i> Shared Notice Board</h2>
                        <button id="add-note-btn" class="btn"><i class="fa-solid fa-plus"></i> Add Note</button>
                    </div>
                    <div class="notes-grid" id="notes-grid">
                        <!-- Notes will be loaded here -->
                    </div>
                </section>
            </div>

        </div>
    </main>

    <!-- Glassmorphic Add Note Modal -->
    <div id="note-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-labelledby="modal-title">
        <div class="modal-content">
            <button id="close-modal-btn" class="modal-close" aria-label="Close modal">&times;</button>
            <h2 id="modal-title"><i class="fa-solid fa-pen-nib"></i> Add New Notice</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="note-text" class="form-label">Write your message:</label>
                    <textarea id="note-text" placeholder="Write something on the board..." required maxlength="200" rows="4"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancel-note-btn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Note</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Glassmorphic Settings Modal -->
    <div id="settings-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-labelledby="settings-title">
        <div class="modal-content settings-content">
            <button id="close-settings-btn" class="modal-close" aria-label="Close settings">&times;</button>
            <h2 id="settings-title"><i class="fa-solid fa-sliders"></i> Portal Settings</h2>
            <form id="settings-form">
                <div class="settings-scroll-container">
                    <!-- MQTT Broker Section -->
                    <div class="settings-group-title">MQTT IoT Broker Settings</div>
                    <div class="form-group">
                        <label for="mqtt-host" class="form-label">Broker WebSocket URL:</label>
                        <input type="url" id="mqtt-host" placeholder="wss://mqtt.smartniwas.com" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group half-width">
                            <label for="mqtt-user" class="form-label">Username:</label>
                            <input type="text" id="mqtt-user" placeholder="mqtt_user">
                        </div>
                        <div class="form-group half-width">
                            <label for="mqtt-pass" class="form-label">Password:</label>
                            <input type="password" id="mqtt-pass" placeholder="••••••••">
                        </div>
                    </div>

                    <!-- CCTV Section Toggle -->
                    <div class="settings-group-title divider">CCTV Camera Settings</div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="cctv-enabled">
                        <label for="cctv-enabled" class="checkbox-label">Enable CCTV Monitoring Module</label>
                    </div>
                    
                    <div id="cctv-settings-fields" class="hidden">
                        <div class="form-group">
                            <label for="nvr-host" class="form-label">NVR Proxy URL:</label>
                            <input type="url" id="nvr-host" placeholder="https://cctv.smartniwas.com">
                        </div>
                        <div class="form-row">
                            <div class="form-group half-width">
                                <label for="nvr-user" class="form-label">NVR Username:</label>
                                <input type="text" id="nvr-user" placeholder="admin">
                            </div>
                            <div class="form-group half-width">
                                <label for="nvr-pass" class="form-label">NVR Password:</label>
                                <input type="password" id="nvr-pass" placeholder="••••••••">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="nvr-channels" class="form-label">Camera Channels (comma-separated):</label>
                            <input type="text" id="nvr-channels" placeholder="101,201,301">
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancel-settings-btn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
