<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartNiwas Portal</title>
    <meta name="description" content="SmartNiwas Portal - A unified glassmorphic home portal featuring a member directory, interactive notice board, and quick dashboard access.">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://smartniwas.com/">
    <meta property="og:title" content="SmartNiwas Portal">
    <meta property="og:description" content="A unified home portal featuring a member directory, interactive notice board, and quick dashboard access.">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://smartniwas.com/">
    <meta property="twitter:title" content="SmartNiwas Portal">
    <meta property="twitter:description" content="A unified home portal featuring a member directory, interactive notice board, and quick dashboard access.">

    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="glass-bg"></div>
    <div class="glass-bg secondary-bg"></div>

    <main class="portal-container">
        <!-- Header -->
        <header class="header">
            <h1 class="logo">
                <i class="fa-solid fa-house-chimney-window"></i>
                <span>smart<strong>niwas</strong></span>
            </h1>
            <div id="live-clock" class="live-clock">Loading time...</div>
        </header>

        <!-- Main Grid -->
        <div class="portal-grid">
            
            <!-- Column 1: Directory -->
            <section class="grid-section directory-section">
                <h2><i class="fa-solid fa-users"></i> Member Directory</h2>
                <div class="member-grid" id="member-grid">
                    <!-- Cards will be dynamically rendered by app.js -->
                </div>
            </section>

            <!-- Column 2: Dashboard & Notes -->
            <div class="right-column">
                <!-- Quick Links -->
                <section class="grid-section links-section">
                    <h2><i class="fa-solid fa-compass"></i> Quick Dashboard Links</h2>
                    <div class="links-grid">
                        <a href="#" class="link-card"><i class="fa-solid fa-images"></i> Photos</a>
                        <a href="#" class="link-card"><i class="fa-solid fa-folder-open"></i> Shared Drive</a>
                        <a href="#" class="link-card"><i class="fa-solid fa-server"></i> Media Server</a>
                        <a href="#" class="link-card"><i class="fa-solid fa-laptop-house"></i> Home Assistant</a>
                    </div>
                </section>

                <!-- Sticky Notes Board -->
                <section class="grid-section notes-section">
                    <div class="notes-header">
                        <h2><i class="fa-solid fa-note-sticky"></i> Shared Notice Board</h2>
                        <button id="add-note-btn" class="btn"><i class="fa-solid fa-plus"></i> Add Note</button>
                    </div>
                    <div class="notes-grid" id="notes-grid">
                        <!-- Notes will be loaded here -->
                    </div>
                </section>
            </div>

        </div>
    </main>

    <!-- Glassmorphic Add Note Modal -->
    <div id="note-modal" class="modal-overlay" aria-hidden="true" role="dialog" aria-labelledby="modal-title">
        <div class="modal-content">
            <button id="close-modal-btn" class="modal-close" aria-label="Close modal">&times;</button>
            <h2 id="modal-title"><i class="fa-solid fa-pen-nib"></i> Add New Notice</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="note-text" class="form-label">Write your message:</label>
                    <textarea id="note-text" placeholder="Write something on the board..." required maxlength="200" rows="4"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancel-note-btn" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Note</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
